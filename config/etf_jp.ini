; 東証上場ETF版CTA（三菱UFJ eスマート証券・kabuステーションAPI）
;
; ■なぜ東証ETFなのか（2026-08-15）
;   ・moomoo証券: 行政処分で口座開設不可＋国内株の出庫を2年拒否していた経緯があり見送り
;   ・Bitget(暗号資産): 2026-08-03に日本撤退発表。11/1クローズオンリー、12/31強制決済
;   → 規制で消えない国内証券会社＝既に口座がある三菱UFJ eスマート証券に集約した。
;   税制も申告分離20.315%で、暗号資産の雑所得(最大55%)より圧倒的に有利。
;
; ■検証結果（2010-11〜2026-08 の15.8年・修復済みデータ）
;   年率+18.7% / Sharpe 0.87 / t値2.95(統計的に有意) / MaxDD 37.9%
;   税引後は年率15.0%。eMAXIS S&P500(NISA非課税19.6%)には勝てない。
;   **本戦略の存在意義は「増やす」ことではなく「ボラを下げる」こと。**
;   オルカン70%+本BOT30%: Sharpe 0.78→0.96 / ボラ19.7%→15.8%（相関0.257）
;
; ■【必読】データは必ず修復を通すこと
;   yfinanceの日本銘柄は分割調整漏れと単日桁化けで壊れている。
;   cta/jp_repair.py を通さないと「1日で-99%」という偽の値動きで
;   全ての判定が狂う（修復前は平均相関0.143、真値は0.330）。
;   cta/etf_data.py の fetch_and_cache が '.T' 銘柄に自動適用する。

[data]
market = etf
db_path = data/etf_jp_cache.db
timeframe_min = 1440
funding_pkl =
; ★米国ETF版(config/etf.ini)も market=etf のため、指定しないと
;   state/etf_paper_* を共有して保有が混ざる。必ず別名にすること。
state_prefix = etf_jp_

[universe]
; 流動性フィルタ（売買代金 1億円/日 以上）を通過し、2010-11以降の履歴がある銘柄。
; 日本株1 / 米国株1 / 貴金属3 / 原油1 / REIT1 = 5資産クラス7銘柄。
; 平均ペア相関 0.330（修復後の真値）。
; ※東証には流動性のある長期米国債ETFが無く（2621は2020-10開始）、
;   CTA最大の分散材料である債券が欠けている。これが米国ETF版(相関0.209)に
;   劣る主因。資金が増えて2621の履歴が伸びたら再検討する。
;
; ※日本株は1306(NEXT FUNDS TOPIX)ではなく1308(上場TOPIX)を使う。
;   1306は2015-07-10にYahoo側の調整誤りで+16.8%の恒久的な水準シフトがあり、
;   同じTOPIXを追う1305/1308/1348が同日に動いていないことで確定した
;   （jp_repairの2.5倍しきい値に掛からないため自動検出できない）。
;   この欠陥を含めるとSharpeが0.82→0.87に水増しされる。
;   1308の売買代金は14.8億円/日で流動性も十分。
;   ※実売買では1306でも問題ない（価格は証券会社APIから取るため）。
;     欠陥はあくまでyfinance由来の**過去データ**の話。
symbols = 1308.T, 1547.T, 1540.T, 1542.T, 1541.T, 1671.T, 1343.T

; ■【要検証】売買単位（1口 or 10口）
;   東証ETFは銘柄ごとに売買単位が異なり、ここがずれると発注数量が桁違いになる。
;   yfinanceは売買単位を持たないため**推測値を書いてはならない**。
;   kabuステーションAPI GET /symbol の TradingUnit が唯一の正解で、
;   tools/verify_kabus_setup.py で取得・照合できる。
;   未指定の銘柄は1として扱われる。
;
;   ★資金要件への影響（現在値ベース・全7銘柄を均等に持つ場合）
;     全て1口単位  : 最大 1542.T ¥30,170 → 必要資金 約21万円 … 30万円で足りる
;     全て10口単位 : 最大 1542.T ¥301,700 → 必要資金 約211万円 … 30万円では不足
;   10口の銘柄が多い場合は、その銘柄を外すか資金を積む判断が必要。
;
; 判明分（発注画面で実測）:
;   1308.T = 1口（2026-08-16に1口4,317円で実際に購入して確認）
; 残りはAPI有効化後に tools/verify_kabus_setup.py で確定させること。
lot_sizes = 1308.T:1

[strategy]
horizons_days = 10:40, 30:120, 60:240
vol_window_days = 30
target_vol = 0.15
; ★現物口座はグロス1.0倍を超えられない。ここを5.0のままにすると
;   バックテストだけが「現物では作れないポジション」を建て、
;   gen2で起きた「検証と実運用の乖離」を再発させる（平均1.49倍・最大4.32倍だった）。
;   実測: 5.0→年率17.7%/Sharpe0.82/DD38.1% ： 1.0→年率12.5%/Sharpe0.87/DD28.1%
;   リターンは落ちるがSharpeは改善しDDが10ポイント減る。レバレッジは
;   ボラを増やしていただけで、リスク調整後では割に合っていなかった。
max_gross = 1.0
; 月次リバランス。日次にすると売買コストで優位が消える（米国ETF版で検証済）
rebalance_days = 21
no_trade_band_pct = 0.05
; 現物のみで運用するためショートは建てない（信用取引を使わない）
long_only = true
; 端数株は発注できない。lot_sizes の整数倍に切り捨てる
integer_shares = true

[risk]
dd_soft = 0.35
dd_hard = 0.40

[costs]
; 三菱UFJ eスマート証券 一日定額手数料: 1日100万円まで0円
fee_rate = 0.0
; 東証ETFは米国ETFより板が薄い。米国ETF版0.03%に対し0.15%を見込む。
; 感応度: slip×2でSharpe 0.87→0.79、×3で0.71（劣化はするが崩壊はしない）
slip_rate = 0.0015
; 円建てなので単位は円。1単位に満たない発注は出さない
min_notional_usd = 5000.0
funding_default_annual_crypto = 0.0
funding_default_annual_gold = 0.0

[capital]
; 口座通貨は円。項目名のusdは「口座通貨建て」の意味で読むこと
init_capital_usd = 300000
