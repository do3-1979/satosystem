; 【実験】東証上場ETF版CTA（現代版5.8年・米国債あり）
; 通貨は円。init_capital_usd は「口座通貨」の意味で円額を入れている。
[data]
market = etf
db_path = data/etf_jp_cache.db
timeframe_min = 1440
funding_pkl =

[universe]
; 流動性フィルタ(売買代金1億円/日以上)を通過し2010-10以降の履歴がある銘柄
; 日本株1 / 米国株1 / 貴金属3 / 原油1 / REIT1
symbols = 1306.T, 1655.T, 2621.T, 1540.T, 1542.T, 1541.T, 1671.T, 1343.T

[strategy]
horizons_days = 10:40, 30:120, 60:240
vol_window_days = 30
target_vol = 0.15
max_gross = 5.0
rebalance_days = 21
no_trade_band_pct = 0.05
long_only = true
integer_shares = true

[risk]
dd_soft = 0.35
dd_hard = 0.40

[costs]
; 三菱UFJ eスマート証券 一日定額手数料: 100万円/日まで無料
fee_rate = 0.0
; 東証ETFは米国ETFより板が薄い。米ETF版0.03%に対し0.15%を見込む
slip_rate = 0.0015
min_notional_usd = 5000.0
funding_default_annual_crypto = 0.0
funding_default_annual_gold = 0.0

[capital]
init_capital_usd = 300000
