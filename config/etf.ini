; ETF版CTA設定（低価格ユニバース版）
;
; ■なぜ低価格ETFなのか（2026-08-14の検証で判明）
;   moomoo証券は端数株のAPI発注に非対応のため、1株単位でしか買えない。
;   SPY($772)やGLD($405)のような高額ETFでは10万円の資金で1株すら買えず、
;   分散が崩れてSharpeが0.65→0.39に劣化していた。
;   同じ資産クラスを低価格の銘柄に置き換えることで、1株単位でも
;   端数株とほぼ同等の性能が出る（下記検証結果）。
;
; ■検証結果（19銘柄・ロングのみ・2008-2026の18年）
;   10万円/1株単位 : 年率+8.86% Sharpe0.65 t値2.50(有意) MaxDD27.2%
;   10万円/端数株   : 年率+10.04% Sharpe0.65 t値2.51     MaxDD30.3%
;   → 1株単位の制約による劣化はほぼ無し
;
; ■置き換えの対応（中身は同等、1株価格のみ違う）
;   金       GLD $405 → IAU  $83
;   米国債20年 TLT $82  → SPTL $25
;   米国債中期 IEF $93  → SPTI $28
;   米国株    SPY $772 → ITOT $170
;   先進国株   EFA $108 → VEA  $73

[data]
market = etf
db_path = data/etf_cache.db
timeframe_min = 1440
funding_pkl =

[universe]
; 5資産クラス19銘柄。長期履歴(2007-08〜)があり、かつ1株価格が低い銘柄を選定
; 株式4 / 債券4 / 商品5 / 通貨5 / 不動産1
symbols = ITOT, VEA, VWO, EWJ,
          SPTL, SPTI, SHY, HYG,
          IAU, SLV, DBA, DBB, DBC,
          UUP, FXE, FXY, FXB, FXA,
          VNQ

[strategy]
horizons_days = 10:40, 30:120, 60:240
vol_window_days = 30
target_vol = 0.15
max_gross = 5.0
; ■リバランス頻度は月次(21営業日)。日次だと破綻する
;   moomoo手数料0.132%/片道は暗号資産(0.055%)の2.4倍あり、回転率が効く。
;   検証(2007-2026): reb=1で turnover 60x・コスト9.8%/yr → Sharpe 0.13
;                    reb=21で turnover 21x・コスト3.5%/yr → Sharpe 0.70
;   グリッドは滑らかで機序も明確(取引減=コスト減)＝過学習ではない。
rebalance_days = 21
no_trade_band_pct = 0.05
long_only = true
; 端数株が使えない口座(moomoo等)では true。1株未満は切り捨てて発注する
integer_shares = true

[risk]
dd_soft = 0.35
dd_hard = 0.40

[costs]
; moomoo証券 米国株/ETF: 約定代金の0.132%(上限$22)、為替手数料無料
fee_rate = 0.00132
slip_rate = 0.0003
min_notional_usd = 1.0
funding_default_annual_crypto = 0.0
funding_default_annual_gold = 0.0

[capital]
; ETF7:暗号3の配分想定。10万円のうち約7万円をETFへ
init_capital_usd = 450
