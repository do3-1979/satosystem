; ETF版CTA設定（2026-08検証で最有望と判定された構成）
;
; 検証結果(2006-2026, 20.6年, ロングのみ):
;   年率+9.96% / Sharpe 0.73 / t値2.85(統計的に有意) / MaxDD 23.1%
;   SPYとの相関 -0.03、SPYが-2%下落した日の平均リターン +0.175%(crisis alpha)
;   株式と50:50で組むと Sharpe 0.53→0.74、MaxDD 55%→22%
;
; 暗号資産版(config/default.ini)との違い:
;   - 日足(1440分) / yfinance / fundingなし / 年間営業日252日
;   - ロングのみ（検証でSharpe 0.50→0.73と全指標改善。信用取引・貸株調達が
;     不要になり、端数株が使えるため10万円でも満額性能が出る）

[data]
market = etf
db_path = data/etf_cache.db
timeframe_min = 1440
funding_pkl =

[universe]
; 5つの資産クラスに分散（平均相関0.21 — これがエッジの源泉）
; 株式6 / 債券5 / 商品6 / 通貨5 / 不動産2
symbols = SPY, QQQ, IWM, EFA, EEM, EWJ,
          TLT, IEF, SHY, LQD, HYG,
          GLD, SLV, DBA, DBB, USO, DBC,
          UUP, FXE, FXY, FXB, FXA,
          VNQ, IYR

[strategy]
horizons_days = 10:40, 30:120, 60:240
vol_window_days = 30
target_vol = 0.15
; 分散が効くほど必要レバレッジは上がる。検証では5xが最良
max_gross = 5.0
rebalance_days = 1
; 感応度分析(2026-08): band 0.02→0.05→0.10 で Sharpe 0.66→0.70→0.72、
; コスト2.83%→2.40%→1.94%/yr と滑らかに改善（機序が明確＝過学習ではない）。
; ただしMaxDDは24.1%→27.0%と悪化するため、中間の0.05を採用。
no_trade_band_pct = 0.05
long_only = true

[risk]
dd_soft = 0.35
dd_hard = 0.40

[costs]
; IBKR米国ETF: 約定額の0.0005(最低$0.35)程度 + スプレッド
fee_rate = 0.0002
slip_rate = 0.0003
min_notional_usd = 1.0
funding_default_annual_crypto = 0.0
funding_default_annual_gold = 0.0

[capital]
; 端数株(fractional shares)が使える前提なら10万円(~$650)でも満額性能
init_capital_usd = 650
